<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PostPal — The Creator’s Operating System</title>
  <style>
    body{margin:0;font-family:Arial, sans-serif;background:#0f1115;color:#eaeef7}
    .wrap{max-width:900px;margin:0 auto;padding:60px 20px}
    h1{font-size:42px;margin-bottom:12px;text-align:center}
    p{font-size:18px;opacity:.9;text-align:center}
    .cta{text-align:center;margin-top:24px}
    .cta a{background:#4f46e5;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold}
    footer{text-align:center;opacity:.6;margin-top:50px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Welcome to PostPal.club</h1>
    <p>AI tools, community, and resources for creators.</p>
    <div class="cta">
      <a href="https://discord.gg/your-link" target="_blank">Join the Community</a>
    </div>
    <footer>© <span id="y"></span> PostPal</footer>
  </div>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
