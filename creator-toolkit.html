<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Toolkit - PostPal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a15 0%, #1a1a3e 50%, #2d1b69 100%);
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1.5rem 2rem;
            background: rgba(10, 10, 21, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link:hover {
            color: #8b5cf6;
        }

        .agent-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
        }

        .agent-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .agent-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .agent-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .agent-description {
            font-size: 1.1rem;
            opacity: 0.8;
            max-width: 600px;
            margin: 0 auto;
        }

        .agent-frame-container {
            flex: 1;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            min-height: 600px;
        }

        .agent-iframe {
            width: 100%;
            height: 100%;
            border: none;
            min-height: 600px;
        }

        @media (max-width: 768px) {
            .agent-container {
                padding: 1rem;
            }

            .agent-title {
                font-size: 2rem;
            }

            .agent-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">PostPal</div>
            <a href="tools.html" class="back-link">← Back to Tools</a>
        </div>
    </header>

    <div class="agent-container">
        <div class="agent-header">
            <div class="agent-icon">🛠️</div>
            <h1 class="agent-title"><span class="gradient-text">Creator Toolkit</span></h1>
            <p class="agent-description">Access quick utilities like thumbnail makers, caption formatters, and schedule planners</p>
        </div>

        <div class="agent-frame-container">
            <iframe 
                id="agentFrame" 
                class="agent-iframe"
                src="https://chatkit.app/embed/wf_68f6f56eef8881f90bbb4c09e508c344530f45d5573eff7ffc?version=1"
                allow="microphone; camera"
            ></iframe>
        </div>
    </div>
</body>
</html>
