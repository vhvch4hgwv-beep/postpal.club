
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - PostPal</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to PostPal AI toolkit for creators.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a15 0%, #1a1a3e 50%, #2d1b69 100%);
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 900;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .suggestions {
            margin-top: 3rem;
            text-align: left;
        }

        .suggestions h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .suggestions ul {
            list-style: none;
        }

        .suggestions li {
            padding: 0.75rem 0;
            opacity: 0.7;
        }

        .suggestions a {
            color: #8b5cf6;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .suggestions a:hover {
            color: #ec4899;
        }

        @media (max-width: 640px) {
            .error-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code" aria-label="Error 404">404</div>
        <h1 class="error-title">Oops! Page Not Found</h1>
        <p class="error-message">
            The page you're looking for seems to have wandered off. Let's get you back on track!
        </p>

        <div class="error-actions">
            <a href="index.html" class="btn btn-primary">Go Home</a>
            <a href="courses.html" class="btn btn-secondary">View Dashboard</a>
        </div>

        <div class="suggestions">
            <h3>Popular Pages:</h3>
            <ul>
                <li>→ <a href="tools.html">AI Tools</a></li>
                <li>→ <a href="agents.html">AI Agents</a></li>
                <li>→ <a href="media-pack.html">Media Pack Creator</a></li>
                <li>→ <a href="community.html">Join Community</a></li>
            </ul>
        </div>
    </div>

    <script>
        // Log 404 for analytics
        console.log('404 Error: Page not found -', window.location.pathname);
    </script>
</body>
</html>
